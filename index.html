          <span class="text-ink/70 dark:text-paper/70">author: aleksei tiulpin or abhishek sambyal</span>
          <span class="mx-3 not-italic opacity-70" aria-hidden="true">·</span>
          <span class="text-ink/70 dark:text-paper/70">author: hinton and deep learning</span>
          <span class="mx-3 not-italic opacity-70" aria-hidden="true">·</span>
          <a href="about.html#how-to-search" class="not-italic text-ink/70 dark:text-paper/70 hover:underline underline-offset-4 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2">how to search →</a>
